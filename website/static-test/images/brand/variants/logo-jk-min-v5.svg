<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 88" fill="none" role="img" aria-label="JIANKALKA">
  <defs>
    <linearGradient id="bg" x1="40" y1="0" x2="40" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141416"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="jk" x1="28" y1="20" x2="52" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D4D4D8"/>
    </linearGradient>
    <linearGradient id="rule" x1="18" y1="58" x2="62" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F3F46" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#A78BFA" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3F3F46" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="40" y1="68" x2="40" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A1A1AA"/>
      <stop offset="1" stop-color="#71717A"/>
    </linearGradient>
    <filter id="jkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ecoGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="80" height="88" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="79" height="87" rx="21.5" stroke="url(#rule)" stroke-opacity="0.35" fill="none"/>

  <text
    x="40"
    y="46"
    text-anchor="middle"
    fill="url(#jk)"
    font-family="Segoe UI, PingFang SC, sans-serif"
    font-size="28"
    font-weight="700"
    letter-spacing="-0.03em"
    filter="url(#jkGlow)"
  >JK</text>

  <circle cx="57" cy="28" r="2.25" fill="#34D399" filter="url(#ecoGlow)"/>
  <circle cx="57" cy="28" r="5" stroke="#34D399" stroke-width="0.75" stroke-opacity="0.35" fill="none"/>

  <line x1="16" y1="58" x2="64" y2="58" stroke="url(#rule)" stroke-width="1.25" stroke-linecap="round"/>
  <circle cx="16" cy="58" r="1" fill="#52525B" opacity="0.8"/>
  <circle cx="64" cy="58" r="1" fill="#52525B" opacity="0.8"/>

  <text
    x="40"
    y="76"
    text-anchor="middle"
    fill="url(#word)"
    font-family="Segoe UI, Helvetica Neue, sans-serif"
    font-size="7.2"
    font-weight="600"
    letter-spacing="0.36em"
  >JIANKALKA</text>
</svg>
